name: Release

# Tags only: the tag is where the version and the release name come from, so there is
# nothing sensible to build from a plain branch. Re-run a failed release with
# `gh run rerun <id>`.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The tag is the source of truth for the version: v1.2.3 -> 1.2.3
      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: board-game-support
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersion="${GITHUB_REF_NAME#v}" --stacktrace

      - name: Fail if the APK is not signed
        run: |
          set -e
          test -f app/build/outputs/apk/release/app-release.apk
          ! test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Name the APK after the release
        run: cp app/build/outputs/apk/release/app-release.apk "board-game-support-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "board-game-support-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
